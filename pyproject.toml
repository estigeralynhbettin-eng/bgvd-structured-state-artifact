[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bgvd-state"
version = "0.1.0"
description = "Evidence-lifecycle middleware for verifier-gated handoff in defensive LLM security agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Yi Lv", email = "lvyi@tongji.edu.cn" },
  { name = "Cheng Wang" }
]
keywords = [
  "cybersecurity",
  "llm-agents",
  "evidence-lifecycle",
  "verifier",
  "handoff",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "jsonschema>=4.22", "pytest>=8.0", "ruff>=0.5"]

[project.scripts]
bgvd-state = "bgvd_state.cli:main"

[project.urls]
Repository = "https://github.com/estigeralynhbettin-eng/bgvd-structured-state-artifact"
Issues = "https://github.com/estigeralynhbettin-eng/bgvd-structured-state-artifact/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
