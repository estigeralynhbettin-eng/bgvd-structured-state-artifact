name: tests

on:
  push:
    branches: [main, softwarex]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src tests reviewer validate_structured_state_artifact.py score_released_rows.py score_cross_family.py score_token_accounting.py protocol_sensitivity.py
      - name: Run tests
        run: pytest
      - name: Verify no-install test discovery
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Run artifact validator
        run: python validate_structured_state_artifact.py --artifact . --out-dir artifact_validation_ci
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: source-and-wheel
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
